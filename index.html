<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="icon" href="data:," />
  <title>厂站分布 - 中国地图 Demo</title>
  <script src="https://api.map.baidu.com/api?v=1.0&amp;type=webgl&amp;ak=9GIDXcPqDfCp6MTp9WWM7x3V529aDElT"></script>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #edf2f7;
      --panel: #ffffff;
      --panel-2: #f8fafc;
      --line: #dbe4ef;
      --line-strong: #c7d2e1;
      --text: #162033;
      --muted: #64748b;
      --weak: #94a3b8;
      --province-pin: #B88FFE;
      --city-pin: #F2AE48;
      --customer-pin: #3370EB;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-soft: #eaf1ff;
      --cyan: #0891b2;
      --green: #16a34a;
      --orange: #d97706;
      --purple: #7c3aed;
      --red: #dc2626;
      --shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
      overflow: hidden;
    }
    button, input, select {
      font: inherit;
      letter-spacing: 0;
    }
    button {
      border: 0;
      background: none;
      color: inherit;
      cursor: pointer;
    }
    .app {
      height: 100vh;
      min-width: 1180px;
      display: grid;
      grid-template-rows: 58px minmax(0, 1fr);
      background:
        radial-gradient(circle at 26% 12%, rgba(37, 99, 235, 0.08), transparent 30%),
        linear-gradient(180deg, #f7faff 0%, #edf2f7 100%);
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 0 22px;
      background: rgba(255, 255, 255, 0.92);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .brand-mark {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: #fff;
      background: linear-gradient(135deg, #2563eb, #0891b2);
      box-shadow: 0 9px 20px rgba(37, 99, 235, 0.22);
      font-weight: 800;
    }
    .brand h1 {
      margin: 0;
      font-size: 17px;
      line-height: 22px;
      font-weight: 760;
    }
    .brand small {
      display: block;
      color: var(--muted);
      font-size: 11px;
      line-height: 16px;
      white-space: nowrap;
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pill {
      height: 30px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: #475569;
      font-size: 12px;
      white-space: nowrap;
    }
    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: 326px minmax(0, 1fr);
      gap: 14px;
      padding: 14px;
    }
    .sidebar,
    .map-panel {
      min-height: 0;
      background: rgba(255,255,255,0.94);
      border: 1px solid var(--line);
      box-shadow: 0 14px 32px rgba(15, 23, 42, 0.08);
      overflow: hidden;
    }
    .sidebar {
      display: grid;
      grid-template-rows: auto auto auto minmax(0, 1fr);
    }
    .side-section {
      padding: 14px;
      border-bottom: 1px solid #e8eef6;
    }
    .side-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      font-size: 13px;
      font-weight: 760;
    }
    .side-title span:last-child {
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .stat {
      min-height: 64px;
      padding: 10px;
      border: 1px solid #e1e9f4;
      border-radius: 8px;
      background: linear-gradient(180deg, #ffffff, #f8fbff);
    }
    .stat strong {
      display: block;
      color: #0f172a;
      font-size: 22px;
      line-height: 26px;
      font-weight: 780;
    }
    .stat span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }
    .filter-row {
      display: grid;
      gap: 8px;
    }
    .search {
      height: 34px;
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr);
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--weak);
    }
    .search svg {
      width: 15px;
      height: 15px;
      margin-left: 10px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }
    .search input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      color: var(--text);
      background: transparent;
      font-size: 12px;
    }
    .segmented {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #f5f8fc;
      gap: 3px;
    }
    .segmented button {
      height: 28px;
      border-radius: 5px;
      color: #526274;
      font-size: 12px;
      white-space: nowrap;
    }
    .segmented button.active {
      color: #fff;
      background: var(--primary);
      box-shadow: 0 6px 14px rgba(37, 99, 235, 0.22);
    }
    .select-line {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .select-line select {
      min-width: 0;
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: #334155;
      padding: 0 8px;
      outline: none;
      font-size: 12px;
    }
    .list {
      min-height: 0;
      overflow: auto;
      padding: 8px 8px 12px;
      background: #fbfdff;
    }
    .list-item {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 9px 8px;
      border-radius: 7px;
      border: 1px solid transparent;
      text-align: left;
    }
    .list-item:hover {
      background: #f2f7ff;
      border-color: #d9e8ff;
    }
    .list-item.active {
      background: var(--primary-soft);
      border-color: #b8cdfb;
    }
    .item-main {
      min-width: 0;
    }
    .item-title {
      display: block;
      overflow: hidden;
      color: #1e293b;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 700;
    }
    .item-meta {
      display: block;
      margin-top: 3px;
      overflow: hidden;
      color: var(--muted);
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11px;
    }
    .item-badge {
      min-width: 42px;
      height: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 8px;
      border-radius: 999px;
      background: #e8f0ff;
      color: var(--primary-dark);
      font-size: 12px;
      font-weight: 760;
      white-space: nowrap;
    }
    .map-panel {
      display: grid;
      grid-template-rows: 48px minmax(0, 1fr);
    }
    .map-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 0 14px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }
    .map-title {
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .map-title strong {
      font-size: 14px;
      line-height: 20px;
      font-weight: 760;
      white-space: nowrap;
    }
    .map-title span {
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .map-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .icon-btn,
    .text-btn {
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: #334155;
      transition: 0.16s ease;
    }
    .icon-btn {
      width: 32px;
      padding: 0;
    }
    .text-btn {
      padding: 0 10px;
      font-size: 12px;
      white-space: nowrap;
    }
    .icon-btn:hover,
    .text-btn:hover {
      border-color: #a9c0e9;
      color: var(--primary);
      background: #f8fbff;
    }
    .icon-btn svg,
    .text-btn svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }
    .zoom-readout {
      min-width: 48px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }
    .map-viewport {
      position: relative;
      min-height: 0;
      overflow: hidden;
      background: #dbe7f2;
      user-select: none;
      touch-action: none;
      cursor: grab;
    }
    .map-viewport.dragging {
      cursor: grabbing;
    }
    .baidu-map {
      position: absolute;
      inset: 0;
      z-index: 0;
      display: none;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .baidu-map.active {
      display: block;
      pointer-events: auto;
    }
    .tile-layer {
      position: absolute;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #dce8f3;
    }
    .tile-layer.hidden {
      display: none;
    }
    .tile-layer img {
      position: absolute;
      width: 256px;
      height: 256px;
      user-select: none;
      -webkit-user-drag: none;
    }
    .tile-layer::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(15, 23, 42, 0.04), transparent 18%, transparent 82%, rgba(15, 23, 42, 0.05)),
        radial-gradient(circle at 48% 45%, transparent 0%, transparent 56%, rgba(248, 250, 252, 0.22) 100%);
    }
    .tile-attribution {
      position: absolute;
      right: 16px;
      bottom: 16px;
      z-index: 12;
      padding: 5px 7px;
      border: 1px solid rgba(203, 213, 225, 0.86);
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.90);
      color: #64748b;
      font-size: 11px;
      line-height: 16px;
    }
    .tile-attribution a { color: #2563eb; text-decoration: none; }
    .marker-layer {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      transition: opacity 120ms ease;
    }
    .marker-wrap {
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: auto;
    }
    .province-marker-wrap { transform: translate(-50%, calc(-100% + 19px)); }
    .city-marker-wrap { transform: translate(-50%, calc(-100% + 17px)); }
    .customer-marker-wrap { transform: translate(-50%, calc(-100% + 14px)); }
    .marker-wrap.hidden {
      display: none;
    }
    .province-marker,
    .city-marker,
    .customer-marker {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 0;
      white-space: nowrap;
    }
    .city-marker,
    .customer-marker {
      gap: 12px;
    }
    .pin {
      position: relative;
      z-index: 1;
      display: inline-grid;
      place-items: center;
      border: 2px solid #fff;
      border-radius: 999px;
      box-shadow: 0 9px 20px rgba(15, 23, 42, 0.20);
      color: #fff;
      font-weight: 800;
      isolation: isolate;
    }
    .province-marker .pin {
      min-width: 38px;
      height: 38px;
      padding: 0 8px;
      background: var(--province-pin);
      font-size: 12px;
    }
    .city-marker .pin {
      min-width: 34px;
      height: 34px;
      padding: 0 7px;
      background: var(--city-pin);
      font-size: 12px;
    }
    .customer-marker .pin {
      min-width: 28px;
      height: 28px;
      padding: 0 7px;
      border-color: var(--customer-pin);
      background: #3370EB;
      background-image: none;
      box-shadow: 0 0 0 2px #fff, 0 9px 20px rgba(51, 112, 235, 0.28);
      font-size: 11px;
    }
    .customer-marker .pin::after {
      border-color: rgba(51, 112, 235, 0.36);
    }
    .pin::after {
      content: "";
      position: absolute;
      z-index: -1;
      inset: -7px;
      border: 1px solid currentColor;
      border-radius: inherit;
      opacity: 0.22;
    }
    .marker-name {
      position: absolute;
      z-index: 18;
      max-width: 176px;
      overflow: hidden;
      padding: 4px 7px;
      border: 1px solid rgba(203, 213, 225, 0.84);
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.92);
      color: #1e293b;
      text-overflow: ellipsis;
      white-space: nowrap;
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.10);
      font-size: 12px;
      font-weight: 700;
      pointer-events: auto;
    }
    .province-marker-name {
      transform: translate(-50%, calc(-100% - 27px));
    }
    .city-marker-name {
      transform: translate(-50%, calc(-100% - 29px));
    }
    .customer-marker-name {
      transform: translate(-50%, calc(-100% - 26px));
    }
    .province-marker-name,
    .city-marker-name {
      color: #0f172a;
    }
    .customer-marker-name {
      max-width: 230px;
      font-weight: 650;
      font-size: 11px;
    }
    .marker-name.active {
      border-color: #93b4f6;
      background: #eff6ff;
    }
    .customer-marker-name.active {
      display: none;
    }
    .marker-wrap.active .pin {
      outline: 3px solid rgba(51, 112, 235, 0.20);
    }
    .popup {
      position: absolute;
      z-index: 20;
      width: 348px;
      padding: 14px;
      border: 1px solid #cbdcf7;
      border-radius: 8px;
      background: rgba(255,255,255,0.98);
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transform: translate(12px, -14px);
      transition: opacity 0.12s ease;
      overscroll-behavior: contain;
    }
    .popup.show {
      opacity: 1;
      pointer-events: auto;
    }
    .popup::before {
      content: "";
      position: absolute;
      left: -7px;
      top: 18px;
      width: 12px;
      height: 12px;
      border-left: 1px solid #cbdcf7;
      border-bottom: 1px solid #cbdcf7;
      background: #fff;
      transform: rotate(45deg);
    }
    .popup-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid #e8eef6;
    }
    .popup-title {
      margin: 0;
      color: #0f172a;
      font-size: 15px;
      line-height: 21px;
      font-weight: 780;
    }
    .popup-close {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border-radius: 5px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1;
    }
    .popup-close:hover {
      background: #f1f5f9;
      color: #0f172a;
    }
    .popup-fields {
      display: grid;
      gap: 10px;
      padding-top: 12px;
    }
    .field-row {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      font-size: 13px;
      line-height: 20px;
    }
    .field-row > span:first-child {
      color: #000;
      font-weight: 800;
    }
    .field-row > span:last-child {
      min-width: 0;
      color: #1e293b;
      font-weight: 650;
    }
    .plant-count-field {
      grid-template-columns: 72px minmax(0, 1fr);
    }
    .total-count {
      display: inline-block;
      color: #0f172a;
      font-size: 14px;
      font-weight: 800;
    }
    .plant-note {
      color: #475569;
      font-size: 13px;
      font-weight: 650;
    }
    .plant-breakdown {
      display: grid;
      gap: 8px;
      max-height: 164px;
      overflow-y: auto;
      overscroll-behavior: contain;
      margin-top: 8px;
      padding: 8px;
      border-radius: 6px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      touch-action: pan-y;
    }
    .plant-type-group {
      display: grid;
      gap: 5px;
    }
    .plant-type-title {
      color: #0f172a;
      font-size: 13px;
      font-weight: 800;
    }
    .plant-type-title strong {
      color: #2563eb;
      font-weight: 850;
    }
    .plant-names {
      color: #475569;
      font-size: 12px;
      line-height: 19px;
      font-weight: 400;
      word-break: break-word;
    }
    .plant-name {
      display: block;
      font-weight: 400;
    }
    .bid-tags {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-left: 6px;
      vertical-align: 1px;
    }
    .bid-tag {
      display: inline-flex;
      align-items: center;
      min-height: 17px;
      padding: 1px 6px;
      border-radius: 4px;
      color: #000;
      font-size: 10px;
      line-height: 14px;
      font-weight: 600;
    }
    .bid-tag-wp {
      background: #dff6e5;
    }
    .bid-tag-apc {
      background: #fef3c7;
    }
    .plant-name + .plant-name {
      margin-top: 3px;
    }
    .legend {
      position: absolute;
      left: 16px;
      bottom: 16px;
      z-index: 12;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,0.92);
      box-shadow: 0 10px 25px rgba(15,23,42,0.08);
      color: #475569;
      font-size: 12px;
    }
    .legend i {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      display: inline-block;
      margin-right: 3px;
    }
    .legend .province { background: var(--province-pin); }
    .legend .city { background: var(--city-pin); }
    .legend .customer { background: var(--customer-pin); }
    .scale {
      position: absolute;
      right: 18px;
      bottom: 18px;
      z-index: 12;
      color: #64748b;
      font-size: 11px;
      text-align: right;
    }
    .scale-line {
      width: 88px;
      height: 6px;
      border-left: 2px solid #64748b;
      border-right: 2px solid #64748b;
      border-bottom: 2px solid #64748b;
      margin-bottom: 4px;
    }
    .empty-note {
      margin: 18px 10px;
      padding: 12px;
      border: 1px dashed #ccd7e5;
      border-radius: 8px;
      color: #64748b;
      background: #fff;
      font-size: 12px;
      line-height: 18px;
    }
    @media (max-width: 1240px) {
      .app { min-width: 1000px; }
      .workspace { grid-template-columns: 292px minmax(0, 1fr); }
      .customer-marker-name { max-width: 170px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">水</div>
        <div>
          <h1>厂站分布</h1>
          <small>截至当前项目清单 · 中国全局视图</small>
        </div>
      </div>
      <div class="top-actions">
        <span class="pill" id="modePill">城市聚合</span>
        <span class="pill" id="sourcePill"></span>
      </div>
    </header>

    <section class="workspace">
      <aside class="sidebar">
        <section class="side-section">
          <div class="side-title"><strong>交付概览</strong><span>项目清单统计</span></div>
          <div class="stat-grid">
            <div class="stat"><strong id="plantTotal">0</strong><span>厂站数量</span></div>
            <div class="stat"><strong id="clientTotal">0</strong><span>客户总数</span></div>
            <div class="stat"><strong id="cityTotal">0</strong><span>覆盖城市</span></div>
          </div>
        </section>

        <section class="side-section">
          <div class="side-title"><strong>筛选</strong><span id="resultCount"></span></div>
          <div class="filter-row">
            <label class="search" for="searchInput">
              <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
              <input id="searchInput" type="text" placeholder="搜索城市 / 客户 / 省份" />
            </label>
            <div class="segmented" id="typeFilter">

    let baiduProgrammaticView = null;

    function coordinateKey(lon, lat) {
      return Number(lon).toFixed(6) + "," + Number(lat).toFixed(6);
    }

    function mapCoordinate(lon, lat) {
      if (MAP_CONFIG.provider !== "baidu") return { lon: Number(lon), lat: Number(lat) };
      return baiduCoordinateCache.get(coordinateKey(lon, lat)) || { lon: Number(lon), lat: Number(lat) };
    }

    function baiduViewKey(lon, lat, zoom) {
      return Number(lon).toFixed(6) + "," + Number(lat).toFixed(6) + "," + Number(zoom).toFixed(2);
    }

    function updateStateFromBaiduMap() {
      if (!baiduMap) return;
      const center = baiduMap.getCenter();
      state.centerLon = center.lng;
      state.centerLat = center.lat;
      state.zoom = baiduMap.getZoom();
      clampMapCenter();
      lastBaiduView = baiduViewKey(state.centerLon, state.centerLat, tileZoom());
      zoomReadout.textContent = Math.round(state.zoom * 100 / 4.15) + "%";
    }

    function clearDrilldownForZoom() {
      if (state.zoom < CUSTOMER_ZOOM_THRESHOLD - 0.6) {
        state.activeCityId = null;
        state.selectedCustomerId = null;
        popup.classList.remove("show");
      }
      if (state.zoom < CITY_ZOOM_THRESHOLD - 0.4) {
        state.activeProvinceId = null;
        state.activeCityId = null;
        state.selectedCustomerId = null;
        popup.classList.remove("show");
      }
    }

    function renderBaiduInteractionFrame() {
      if (!baiduMapReady || !baiduMap) return;
      viewport.dataset.mapViewReady = "false";
      window.cancelAnimationFrame(baiduOverlayFrame);
      baiduOverlayFrame = window.requestAnimationFrame(function() {
        if (!baiduProgrammaticView) updateStateFromBaiduMap();
        renderMarkers(true);
        const customer = selectedCustomer();
        if (customer) renderPopup(customer);
      });
      finishBaiduInteraction();
    }

    function finishBaiduInteraction() {
      if (!baiduMapReady || !baiduMap) return;
      window.clearTimeout(baiduInteractionEndTimer);
      baiduInteractionEndTimer = window.setTimeout(function() {
        window.clearTimeout(baiduViewTimer);
        updateStateFromBaiduMap();
        baiduProgrammaticView = null;
        viewport.dataset.mapViewReady = "true";
        clearDrilldownForZoom();
        renderAll();
      }, 120);
    }

    function initializeBaiduMap() {
      baiduMap = new BMapGL.Map("baiduMap", { enableMapClick: false });
      if (typeof baiduMap.enableScrollWheelZoom === "function") baiduMap.enableScrollWheelZoom(true);
      ["enableDragging", "enableDoubleClickZoom", "enablePinchToZoom", "enableInertialDragging", "enableContinuousZoom"].forEach(function(method) {
        if (typeof baiduMap[method] === "function") baiduMap[method]();
      });
      const initial = mapCoordinate(INITIAL_CENTER.lon, INITIAL_CENTER.lat);
      state.centerLon = initial.lon;
      state.centerLat = initial.lat;
      baiduMap.addEventListener("moving", renderBaiduInteractionFrame);
      baiduMap.addEventListener("zooming", renderBaiduInteractionFrame);
      baiduMap.addEventListener("moveend", finishBaiduInteraction);
      baiduMap.addEventListener("zoomend", finishBaiduInteraction);
      baiduMap.addEventListener("click", function() {
        if (!state.selectedCustomerId) return;
        state.selectedCustomerId = null;
        popup.classList.remove("show");
        renderAll();
      });
      baiduMap.addEventListener("tilesloaded", function() {
        if (baiduMapReady) return;
        baiduMapReady = true;
        baiduProgrammaticView = null;
        updateStateFromBaiduMap();
        viewport.dataset.mapReady = "true";
        viewport.dataset.mapViewReady = "true";
        viewport.dataset.mapInteractionMode = "native";
        renderAll();
      });
      lastBaiduView = baiduViewKey(state.centerLon, state.centerLat, tileZoom());
      baiduMap.centerAndZoom(new BMapGL.Point(state.centerLon, state.centerLat), tileZoom());
    }

    function loadBaiduMap() {
      if (MAP_CONFIG.provider !== "baidu") return;
      let attempts = 0;
      const waitForApi = function() {
        if (window.BMapGL) {
          try {
            initializeBaiduMap();
          } catch (error) {
            viewport.dataset.mapReady = "error";
            console.error(error);
          }
          return;
        }
        attempts += 1;
        if (attempts >= 100) {
          viewport.dataset.mapReady = "error";
          console.error("Baidu Maps API did not initialize.");
          return;
        }
        window.setTimeout(waitForApi, 100);
      };
      waitForApi();
    }

    const state = {
      zoom: 4.15,
      centerLon: INITIAL_CENTER.lon,
      centerLat: INITIAL_CENTER.lat,
      activeProvinceId: null,
      activeCityId: null,
      selectedCustomerId: null,
      query: "",
      type: "全部",
      region: "全部区域",
      province: "全部省份",
      dragging: false,
      lastPointer: null,
    };

    const viewport = document.getElementById("mapViewport");
    const baiduMapElement = document.getElementById("baiduMap");
    const tileLayer = document.getElementById("tileLayer");
    const tileAttribution = document.getElementById("tileAttribution");
    const markerLayer = document.getElementById("markerLayer");
    const popup = document.getElementById("popup");
    const sideList = document.getElementById("sideList");
    const searchInput = document.getElementById("searchInput");
    const regionFilter = document.getElementById("regionFilter");
    const provinceFilter = document.getElementById("provinceFilter");
    const zoomReadout = document.getElementById("zoomReadout");

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, function(char) {
        return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[char];
      });
    }

    function tileZoom() {
      return Math.max(MIN_MAP_ZOOM, Math.min(MAX_MAP_ZOOM, Math.round(state.zoom)));
    }

    function clampLat(lat) {
      return Math.max(-85.05112878, Math.min(85.05112878, lat));
    }

    function lonLatToPixel(lon, lat, zoom) {
      const scale = TILE_SIZE * Math.pow(2, zoom);
      const safeLat = clampLat(lat);
      const sinLat = Math.sin((safeLat * Math.PI) / 180);
      return {
        x: ((lon + 180) / 360) * scale,
        y: (0.5 - Math.log((1 + sinLat) / (1 - sinLat)) / (4 * Math.PI)) * scale,
      };
    }

    function pixelToLonLat(x, y, zoom) {
      const scale = TILE_SIZE * Math.pow(2, zoom);
      const lon = (x / scale) * 360 - 180;
      const n = Math.PI - (2 * Math.PI * y) / scale;
      const lat = (180 / Math.PI) * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
      return { lon: Math.max(73, Math.min(135, lon)), lat: Math.max(18, Math.min(54, lat)) };
    }

    function currentTopLeft() {
      const rect = viewport.getBoundingClientRect();
      const zoom = tileZoom();
      const center = lonLatToPixel(state.centerLon, state.centerLat, zoom);
      return {
        zoom,
        x: center.x - rect.width / 2,
        y: center.y - rect.height / 2,
        width: rect.width,
        height: rect.height,
      };
    }

    function clampMapCenter() {
      state.zoom = Math.max(MIN_MAP_ZOOM, Math.min(MAX_MAP_ZOOM, state.zoom));
      state.centerLon = Math.max(73, Math.min(135, state.centerLon));
      state.centerLat = Math.max(18, Math.min(54, state.centerLat));
    }

    function syncBaiduMap() {
      if (!baiduMapReady || !baiduMap) return;
      const zoom = tileZoom();
      const viewKey = baiduViewKey(state.centerLon, state.centerLat, zoom);
      if (viewKey === lastBaiduView) return;
      baiduProgrammaticView = viewKey;
      lastBaiduView = viewKey;
      viewport.dataset.mapViewReady = "false";
      baiduMap.centerAndZoom(new BMapGL.Point(state.centerLon, state.centerLat), zoom);
      window.clearTimeout(baiduViewTimer);
      baiduViewTimer = window.setTimeout(function() {
        if (baiduProgrammaticView !== viewKey) return;
        updateStateFromBaiduMap();
        baiduProgrammaticView = null;
        viewport.dataset.mapViewReady = "true";
        clearDrilldownForZoom();
        renderAll();
      }, 1000);
    }

    function renderTiles() {
      clampMapCenter();
      if (MAP_CONFIG.provider === "baidu") {
        tileLayer.classList.add("hidden");
        baiduMapElement.classList.add("active");
        syncBaiduMap();
        zoomReadout.textContent = Math.round(state.zoom * 100 / 4.15) + "%";
        return;
      }
      const view = currentTopLeft();
      const maxTile = Math.pow(2, view.zoom);
      const startX = Math.floor(view.x / TILE_SIZE);
      const endX = Math.floor((view.x + view.width) / TILE_SIZE);
      const startY = Math.floor(view.y / TILE_SIZE);
      const endY = Math.floor((view.y + view.height) / TILE_SIZE);
      const fragments = [];
      for (let tileX = startX; tileX <= endX; tileX += 1) {
        for (let tileY = startY; tileY <= endY; tileY += 1) {
          if (tileY < 0 || tileY >= maxTile) continue;
          const wrappedX = ((tileX % maxTile) + maxTile) % maxTile;
          const left = Math.round(tileX * TILE_SIZE - view.x);
          const top = Math.round(tileY * TILE_SIZE - view.y);
          MAP_CONFIG.layers.forEach(function(layer, layerIndex) {
            const subdomains = MAP_CONFIG.subdomains || [""];
            const subdomain = subdomains[Math.abs(wrappedX + tileY + layerIndex) % subdomains.length];
            const src = layer.url
              .replaceAll("{s}", subdomain)
              .replaceAll("{z}", view.zoom)
              .replaceAll("{x}", wrappedX)
              .replaceAll("{y}", tileY);
            const zIndex = Number.isFinite(layer.zIndex) ? layer.zIndex : layerIndex;
            fragments.push('<img alt="" loading="eager" decoding="async" src="' + escapeHTML(src) + '" style="left:' + left + 'px;top:' + top + 'px;z-index:' + zIndex + '">');
          });
        }
      }
      tileLayer.innerHTML = fragments.join("");
      zoomReadout.textContent = Math.round(state.zoom * 100 / 4.15) + "%";
    }

    function lonLatToScreen(lon, lat) {
      const mapPoint = mapCoordinate(lon, lat);
      if (MAP_CONFIG.provider === "baidu" && baiduMapReady && baiduMap) {
        const pixel = baiduMap.pointToOverlayPixel(new BMapGL.Point(mapPoint.lon, mapPoint.lat));
        const rect = viewport.getBoundingClientRect();
        return {
          x: pixel.x,
          y: pixel.y,
          visible: pixel.x >= -120 && pixel.x <= rect.width + 120 && pixel.y >= -80 && pixel.y <= rect.height + 80,
        };
      }
      const view = currentTopLeft();
      const point = lonLatToPixel(mapPoint.lon, mapPoint.lat, view.zoom);
      return {
        x: point.x - view.x,
        y: point.y - view.y,
        visible: point.x >= view.x - 120 && point.x <= view.x + view.width + 120 && point.y >= view.y - 80 && point.y <= view.y + view.height + 80
      };
    }

    function currentMode() {
      if (state.activeCityId || state.zoom >= CUSTOMER_ZOOM_THRESHOLD) return "customer";
      if (state.activeProvinceId || state.zoom >= CITY_ZOOM_THRESHOLD) return "city";
      return "province";
    }

    function activeProvince() {
      return DATA.provinces.find(function(province) { return province.id === state.activeProvinceId; }) || null;
    }

    function activeCity() {
      return DATA.cities.find(function(city) { return city.id === state.activeCityId; }) || null;
    }

    function selectedCustomer() {
      return DATA.customers.find(function(customer) { return customer.id === state.selectedCustomerId; }) || null;
    }

    function provinceMatchesFilters(province) {
      const q = state.query.trim().toLowerCase();
      const inProvince = state.province === "全部省份" || province.province === state.province;
      const inRegion = state.region === "全部区域" || province.region.split(" / ").includes(state.region);
      const hasType = state.type === "全部" || visiblePlantCountForProvince(province) > 0;
      const text = (province.province + " " + province.cities.join(" ")).toLowerCase();
      return inProvince && inRegion && hasType && (!q || text.includes(q) || matchingCustomersForProvince(province).length > 0);
    }

    function cityMatchesFilters(city) {
      const q = state.query.trim().toLowerCase();
      const inProvince = state.province === "全部省份" || city.province === state.province;
      const inRegion = state.region === "全部区域" || city.region.split(" / ").includes(state.region);
      const inActiveProvince = !state.activeProvinceId || city.province === state.activeProvinceId;
      const hasType = state.type === "全部" || visiblePlantCountForCity(city) > 0;
      const text = (city.province + " " + city.city).toLowerCase();
      return inProvince && inRegion && inActiveProvince && hasType && (!q || text.includes(q) || matchingCustomersForCity(city).length > 0);
    }

    function customerMatchesFilters(customer) {
      const q = state.query.trim().toLowerCase();
      const inType = state.type === "全部" || customer.plantTypes.includes(state.type);
      const inProvince = state.province === "全部省份" || customer.province === state.province;
      const inRegion = state.region === "全部区域" || customer.region.split(" / ").includes(state.region);
      const inActiveProvince = !state.activeProvinceId || customer.province === state.activeProvinceId;
      const inActiveCity = !state.activeCityId || (customer.province + "-" + customer.city) === state.activeCityId;
      const text = (customer.province + " " + customer.city + " " + customer.customer + " " + customer.plantTypes.join(" ")).toLowerCase();
      return inType && inProvince && inRegion && inActiveProvince && inActiveCity && (!q || text.includes(q));
    }

    function matchingCustomersForProvince(province) {
      return DATA.customers.filter(function(customer) {
        return customer.province === province.province && customerMatchesFilters(customer);
      });
    }

    function matchingCustomersForCity(city) {
      return DATA.customers.filter(function(customer) {
        return customer.province === city.province && customer.city === city.city && customerMatchesFilters(customer);
      });
    }

    function filteredProvinces() {
      return DATA.provinces.filter(provinceMatchesFilters);
    }

    function filteredCities() {
      return DATA.cities.filter(cityMatchesFilters);
    }

    function filteredCustomers() {
      return DATA.customers.filter(customerMatchesFilters);
    }

    function visiblePlantCountForCustomer(customer) {
      if (state.type === "污水厂") return customer.wastewaterCount;
      if (state.type === "自来水厂") return customer.waterCount;
      return customer.plantCount;
    }

    function visiblePlantCountForCity(city) {
      return DATA.customers.reduce(function(total, customer) {
        if (customer.province !== city.province || customer.city !== city.city) return total;
        return total + visiblePlantCountForCustomer(customer);
      }, 0);
    }

    function visiblePlantCountForProvince(province) {
      return DATA.customers.reduce(function(total, customer) {
        if (customer.province !== province.province) return total;
        return total + visiblePlantCountForCustomer(customer);
      }, 0);
    }

    function customerScreen(customer) {
      const base = lonLatToScreen(customer.lon, customer.lat);
      const total = Math.max(customer.cityCustomerTotal, 1);
      if (total <= 1) return base;
      const angle = (Math.PI * 2 * customer.cityCustomerIndex / total) - Math.PI / 2;
      const radius = state.activeCityId ? Math.min(84, 34 + Math.sqrt(total) * 10) : Math.min(52, 18 + Math.sqrt(total) * 5);
      return {
        x: base.x + Math.cos(angle) * radius,
        y: base.y + Math.sin(angle) * radius * 0.72,
        visible: base.visible
      };
    }

    function markerButton(html, className, left, top, active, attrs) {
      const wrap = document.createElement("div");
      wrap.className = "marker-wrap " + className + "-wrap" + (active ? " active" : "");
      wrap.style.left = left + "px";
      wrap.style.top = top + "px";
      const button = document.createElement("button");
      button.className = className;
      Object.keys(attrs || {}).forEach(function(key) { button.setAttribute(key, attrs[key]); });
      button.innerHTML = html;
      wrap.appendChild(button);
      return wrap;
    }

    function markerLabel(text, className, left, top, active, attrs) {
      const label = document.createElement("button");
      label.type = "button";
      label.className = "marker-name " + className + "-name" + (active ? " active" : "");
      label.style.left = left + "px";
      label.style.top = top + "px";
      Object.keys(attrs || {}).forEach(function(key) { label.setAttribute(key, attrs[key]); });
      label.textContent = text;
      return label;
    }

    function renderMarkers(skipMapSync) {
      if (!skipMapSync) renderTiles();
      markerLayer.innerHTML = "";
      const mode = currentMode();
      document.getElementById("modePill").textContent = mode === "province" ? "省份聚合" : (mode === "city" ? "城市聚合" : "客户标点");
      if (mode === "province") {
        filteredProvinces().forEach(function(province) {
          const pos = lonLatToScreen(province.lon, province.lat);
          if (!pos.visible) return;
          const count = visiblePlantCountForProvince(province);
          const html = '<span class="pin">' + count + '</span>';
          const marker = markerButton(html, "province-marker", pos.x, pos.y, false, {"aria-label": province.province + count + "座厂站"});
          const label = markerLabel(province.province, "province-marker", pos.x, pos.y, false, {"aria-label": province.province + count + "座厂站"});
          label.addEventListener("click", function(event) {
            event.stopPropagation();
            focusProvince(province.id);
          });
          marker.querySelector("button").addEventListener("click", function(event) {
            event.stopPropagation();
            focusProvince(province.id);
          });
          markerLayer.appendChild(marker);
          markerLayer.appendChild(label);
        });
      } else if (mode === "city") {
        filteredCities().forEach(function(city) {
          const pos = lonLatToScreen(city.lon, city.lat);
          if (!pos.visible) return;
          const count = visiblePlantCountForCity(city);
          const html = '<span class="pin">' + count + '</span>';
          const marker = markerButton(html, "city-marker", pos.x, pos.y, false, {"aria-label": city.city + count + "座厂站"});
          const label = markerLabel(city.city, "city-marker", pos.x, pos.y, false, {"aria-label": city.city + count + "座厂站"});
          label.addEventListener("click", function(event) {
            event.stopPropagation();
            focusCity(city.id);
          });
          marker.querySelector("button").addEventListener("click", function(event) {
            event.stopPropagation();
            focusCity(city.id);
          });
          markerLayer.appendChild(marker);
          markerLayer.appendChild(label);
        });
      } else {
        filteredCustomers().forEach(function(customer) {
          const pos = customerScreen(customer);
          if (!pos.visible) return;
          const label = customer.customer;
          const html = '<span class="pin">' + customer.plantCount + '</span>';
          const marker = markerButton(html, "customer-marker", pos.x, pos.y, customer.id === state.selectedCustomerId, {"aria-label": label + customer.plantCount + "座水厂"});
          const nameLabel = markerLabel(label, "customer-marker", pos.x, pos.y, customer.id === state.selectedCustomerId, {"aria-label": label + customer.plantCount + "座水厂"});
          marker.dataset.customerId = customer.id;
          nameLabel.dataset.customerId = customer.id;
          nameLabel.addEventListener("click", function(event) {
            event.stopPropagation();
            selectCustomer(customer.id);
          });
          marker.querySelector("button").addEventListener("click", function(event) {
            event.stopPropagation();
            selectCustomer(customer.id);
          });
          markerLayer.appendChild(marker);
          markerLayer.appendChild(nameLabel);
        });
      }
      positionPopup();
      updateChrome();
    }

    function updateChrome() {
      const mode = currentMode();
      const province = activeProvince();
      const city = activeCity();
      const provinces = filteredProvinces();
      const customers = filteredCustomers();
      const cities = filteredCities();
      document.getElementById("mapHeading").textContent = city ? city.city + "厂站分布" : (province ? province.province + "厂站分布" : "中国厂站分布");
      document.getElementById("mapSubheading").textContent = mode === "province"
        ? "省份标点显示厂站数量"
        : (mode === "city" ? "城市标点显示厂站数量" : "客户标点显示厂站数量");
      document.getElementById("resultCount").textContent = mode === "province" ? provinces.length + " 省份" : (mode === "city" ? cities.length + " 城市" : customers.length + " 客户");
      document.getElementById("cityTotal").textContent = DATA.summary.cities;
      document.getElementById("clientTotal").textContent = DATA.summary.clients;
      document.getElementById("plantTotal").textContent = DATA.summary.plants;
      document.getElementById("sourcePill").textContent = DATA.source.sheet + " · " + DATA.summary.plants + " 条厂站";
    }

    function renderSideList() {
      const mode = currentMode();
      const province = activeProvince();
      const city = activeCity();
      if (mode === "province") {
        const provinces = filteredProvinces().slice().sort(function(a, b) {
          return visiblePlantCountForProvince(b) - visiblePlantCountForProvince(a);
        });
        document.getElementById("listTitle").textContent = "省份列表";
        document.getElementById("listMeta").textContent = provinces.length + " 个";
        sideList.innerHTML = provinces.map(function(item) {
          const count = visiblePlantCountForProvince(item);
          return '<button class="list-item" data-province="' + escapeHTML(item.id) + '">' +
            '<span class="item-main"><span class="item-title">' + escapeHTML(item.province) + '</span>' +
            '<span class="item-meta">' + escapeHTML(item.cityCount + " 个城市 · " + item.plantCount + " 座水厂") + '</span></span>' +
            '<span class="item-badge">' + count + ' 座</span>' +
          '</button>';
        }).join("") || '<div class="empty-note">未匹配到省份</div>';
        sideList.querySelectorAll("[data-province]").forEach(function(button) {
          button.addEventListener("click", function() { focusProvince(button.dataset.province); });
        });
      } else if (mode === "city") {
        const cities = filteredCities();
        document.getElementById("listTitle").textContent = province ? province.province + "城市列表" : "城市列表";
        document.getElementById("listMeta").textContent = cities.length + " 个";
        sideList.innerHTML = cities.map(function(item) {
          const count = visiblePlantCountForCity(item);
          return '<button class="list-item" data-city="' + escapeHTML(item.id) + '">' +
            '<span class="item-main"><span class="item-title">' + escapeHTML(item.city) + '</span>' +
            '<span class="item-meta">' + escapeHTML(item.province + " · " + item.region + "区 · " + item.plantCount + " 座水厂") + '</span></span>' +
            '<span class="item-badge">' + count + ' 座</span>' +
          '</button>';
        }).join("") || '<div class="empty-note">未匹配到城市</div>';
        sideList.querySelectorAll("[data-city]").forEach(function(button) {
          button.addEventListener("click", function() { focusCity(button.dataset.city); });
        });
      } else {
        const customers = filteredCustomers();
        document.getElementById("listTitle").textContent = city ? city.city + "客户列表" : "客户列表";
        document.getElementById("listMeta").textContent = customers.length + " 个";
        sideList.innerHTML = customers.map(function(item) {
          const active = item.id === state.selectedCustomerId ? " active" : "";
          return '<button class="list-item' + active + '" data-customer="' + escapeHTML(item.id) + '">' +
            '<span class="item-main"><span class="item-title">' + escapeHTML(item.customer) + '</span>' +
            '<span class="item-meta">' + escapeHTML(item.city + " · " + item.region + "区") + '</span></span>' +
            '<span class="item-badge">' + item.plantCount + ' 座</span>' +
          '</button>';
        }).join("") || '<div class="empty-note">未匹配到客户</div>';
        sideList.querySelectorAll("[data-customer]").forEach(function(button) {
          button.addEventListener("click", function(event) {
            event.stopPropagation();
            const customer = DATA.customers.find(function(item) { return item.id === button.dataset.customer; });
            if (customer) {
              state.activeProvinceId = customer.province;
              state.activeCityId = customer.province + "-" + customer.city;
              focusMap(customer.lon, customer.lat, Math.max(state.zoom, 8.2));
            }
            selectCustomer(button.dataset.customer);
          });
        });
      }
    }

    function renderPlantNames(stations) {
      const names = (stations || []).filter(Boolean);
      if (!names.length) return '<div class="plant-names">暂无水厂名称</div>';
      return '<div class="plant-names">' + names.map(function(station) {
        const stationName = typeof station === "string" ? station : (station.name || "");
        const bidTags = Array.isArray(station.bidTags) ? station.bidTags : [];
        const tags = bidTags.length
          ? '<span class="bid-tags">' + bidTags.map(function(tag) {
              const tagClass = tag === "APC" ? " bid-tag-apc" : " bid-tag-wp";
              return '<span class="bid-tag' + tagClass + '">' + escapeHTML(tag) + '</span>';
            }).join("") + '</span>'
          : "";
        return '<span class="plant-name"><span class="plant-name-text">' + escapeHTML(stationName) + '</span>' + tags + '</span>';
      }).join("") + '</div>';
    }

    function formatCapacity(value) {
      const number = Number(value);
      const text = Number.isFinite(number)
        ? (Number.isInteger(number) ? String(number) : String(Math.round(number * 100) / 100))
        : String(value);
      return escapeHTML(text) + ' m³/d';
    }

    function renderPlantBreakdown(customer) {
      const groups = (customer.plantGroups || []).filter(function(group) {
        return group && group.count > 0;
      });
      if (!groups.length) return "";
      if (groups.length === 1) {
        return '<div class="plant-breakdown plant-breakdown-single">' +
          renderPlantNames(groups[0].stations) +
        '</div>';
      }
      return '<div class="plant-breakdown">' + groups.map(function(group) {
        return '<section class="plant-type-group">' +
          '<div class="plant-type-title">' + escapeHTML(group.type) + ' <strong>' + group.count + '座</strong></div>' +
          renderPlantNames(group.stations) +
        '</section>';
      }).join("") + '</div>';
    }

    function renderPlantTotal(customer) {
      const groups = (customer.plantGroups || []).filter(function(group) {
        return group && group.count > 0;
      });
      const note = groups.length === 1
        ? ' <span class="plant-note">（' + escapeHTML(groups[0].type) + groups[0].count + '座）</span>'
        : "";
      return '<span class="total-count">' + customer.plantCount + '座' + note + '</span>' + renderPlantBreakdown(customer);
    }

    function renderPopup(customer) {
      if (!customer) {
        popup.classList.remove("show");
        popup.innerHTML = "";
        return;
      }
      popup.innerHTML =
        '<div class="popup-head"><h2 class="popup-title">' + escapeHTML(customer.customer) + '</h2>' +
        '<button class="popup-close" id="popupClose" aria-label="关闭">×</button></div>' +
        '<div class="popup-fields">' +
          '<div class="field-row plant-count-field"><span>水厂数量</span><span>' + renderPlantTotal(customer) + '</span></div>' +
        '</div>';
      document.getElementById("popupClose").addEventListener("click", function(event) {
        event.stopPropagation();
        state.selectedCustomerId = null;
        renderAll();
      });
      popup.classList.add("show");
      positionPopup();
    }

    function positionPopup() {
      const customer = selectedCustomer();
      if (!customer || !popup.classList.contains("show")) return;
      const pos = customerScreen(customer);
      if (!pos.visible) {
        popup.classList.remove("show");
        return;
      }
      const rect = viewport.getBoundingClientRect();
      const left = Math.min(rect.width - 378, Math.max(12, pos.x + 20));
      const top = Math.min(rect.height - 300, Math.max(12, pos.y - 24));
      popup.style.left = left + "px";
      popup.style.top = top + "px";
    }

    function selectCustomer(customerId) {
      state.selectedCustomerId = customerId;
      const customer = selectedCustomer();
      if (customer) {
        state.activeProvinceId = customer.province;
        state.activeCityId = customer.province + "-" + customer.city;
        if (state.zoom < 7.2) focusMap(customer.lon, customer.lat, 8.2);
      }
      renderAll();
      renderPopup(customer);
    }

    function focusProvince(provinceId) {
      const province = DATA.provinces.find(function(item) { return item.id === provinceId; });
      if (!province) return;
      state.activeProvinceId = province.id;
      state.activeCityId = null;
      state.selectedCustomerId = null;
      focusMap(province.lon, province.lat, 6.7);
      renderAll();
    }

    function focusCity(cityId) {
      const city = DATA.cities.find(function(item) { return item.id === cityId; });
      if (!city) return;
      state.activeProvinceId = city.province;
      state.activeCityId = city.id;
      state.selectedCustomerId = null;
      focusMap(city.lon, city.lat, 8.2);
      renderAll();
    }

    function focusMap(lon, lat, zoom) {
      const point = mapCoordinate(lon, lat);
      state.zoom = Math.max(MIN_MAP_ZOOM, Math.min(MAX_MAP_ZOOM, zoom));
      state.centerLon = point.lon;
      state.centerLat = point.lat;
      clampMapCenter();
    }

    function resetMap() {
      const initial = mapCoordinate(INITIAL_CENTER.lon, INITIAL_CENTER.lat);
      state.zoom = 4.15;
      state.centerLon = initial.lon;
      state.centerLat = initial.lat;
      state.activeProvinceId = null;
      state.activeCityId = null;
      state.selectedCustomerId = null;
      popup.classList.remove("show");
      renderAll();
    }

    function zoomAt(delta, anchorX, anchorY) {
      if (MAP_CONFIG.provider === "baidu" && baiduMapReady && baiduMap) {
        updateStateFromBaiduMap();
        const direction = delta > 1 ? 1 : -1;
        state.zoom = Math.max(MIN_MAP_ZOOM, Math.min(MAX_MAP_ZOOM, Math.round(state.zoom) + direction));
        clearDrilldownForZoom();
        renderAll();
        return;
      }
      const rect = viewport.getBoundingClientRect();
      const before = currentTopLeft();
      const anchorWorld = {
        x: before.x + anchorX,
        y: before.y + anchorY,
      };
      const anchorLonLat = pixelToLonLat(anchorWorld.x, anchorWorld.y, before.zoom);
      const nextZoom = Math.max(MIN_MAP_ZOOM, Math.min(MAX_MAP_ZOOM, state.zoom * delta));
      state.zoom = nextZoom;
      const afterZoom = tileZoom();
      const anchorAfter = lonLatToPixel(anchorLonLat.lon, anchorLonLat.lat, afterZoom);
      const centerAfter = {
        x: anchorAfter.x - anchorX + rect.width / 2,
        y: anchorAfter.y - anchorY + rect.height / 2,
      };
      const centerLonLat = pixelToLonLat(centerAfter.x, centerAfter.y, afterZoom);
      state.centerLon = centerLonLat.lon;
      state.centerLat = centerLonLat.lat;
      clampMapCenter();
      clearDrilldownForZoom();
      renderAll();
    }

    function setupFilters() {
      const regions = ["全部区域"].concat(DATA.summary.regions);
      const provinces = ["全部省份"].concat(Array.from(new Set(DATA.cities.map(function(city) { return city.province; }))).sort());
      regionFilter.innerHTML = regions.map(function(item) { return '<option value="' + escapeHTML(item) + '">' + escapeHTML(item) + '</option>'; }).join("");
      provinceFilter.innerHTML = provinces.map(function(item) { return '<option value="' + escapeHTML(item) + '">' + escapeHTML(item) + '</option>'; }).join("");
      document.getElementById("typeFilter").querySelectorAll("button").forEach(function(button) {
        button.addEventListener("click", function() {
          state.type = button.dataset.type;
          document.getElementById("typeFilter").querySelectorAll("button").forEach(function(item) { item.classList.toggle("active", item === button); });
          state.selectedCustomerId = null;
          renderAll();
        });
      });
      searchInput.addEventListener("input", function(event) {
        state.query = event.target.value;
        state.selectedCustomerId = null;
        renderAll();
      });
      regionFilter.addEventListener("change", function(event) {
        state.region = event.target.value;
        state.selectedCustomerId = null;
        renderAll();
      });
      provinceFilter.addEventListener("change", function(event) {
        state.province = event.target.value;
        state.activeProvinceId = null;
        state.activeCityId = null;
        state.selectedCustomerId = null;
        renderAll();
      });
    }

    function setupMapEvents() {
      document.getElementById("zoomInBtn").addEventListener("click", function() {
        const rect = viewport.getBoundingClientRect();
        zoomAt(1.22, rect.width / 2, rect.height / 2);
      });
      document.getElementById("zoomOutBtn").addEventListener("click", function() {
        const rect = viewport.getBoundingClientRect();
        zoomAt(1 / 1.22, rect.width / 2, rect.height / 2);
      });
      document.getElementById("resetBtn").addEventListener("click", resetMap);
      popup.addEventListener("wheel", function(event) {
        event.stopPropagation();
      }, { passive: true });
      viewport.addEventListener("wheel", function(event) {
        if (MAP_CONFIG.provider === "baidu") return;
        event.preventDefault();
        const rect = viewport.getBoundingClientRect();
        const delta = event.deltaY < 0 ? 1.16 : 1 / 1.16;
        zoomAt(delta, event.clientX - rect.left, event.clientY - rect.top);
      }, { passive: false });
      viewport.addEventListener("pointerdown", function(event) {
        if (MAP_CONFIG.provider === "baidu") return;
        if (event.target.closest(".marker-wrap, .popup, button, input, select")) return;
        state.dragging = true;
        state.lastPointer = { x: event.clientX, y: event.clientY };
        viewport.classList.add("dragging");
        viewport.setPointerCapture(event.pointerId);
      });
      viewport.addEventListener("pointermove", function(event) {
        if (MAP_CONFIG.provider === "baidu") return;
        if (!state.dragging || !state.lastPointer) return;
        const dx = event.clientX - state.lastPointer.x;
        const dy = event.clientY - state.lastPointer.y;
        const zoom = tileZoom();
        const center = lonLatToPixel(state.centerLon, state.centerLat, zoom);
        const nextCenter = pixelToLonLat(center.x - dx, center.y - dy, zoom);
        state.centerLon = nextCenter.lon;
        state.centerLat = nextCenter.lat;
        clampMapCenter();
        state.lastPointer = { x: event.clientX, y: event.clientY };
        renderMarkers();
      });
      viewport.addEventListener("pointerup", function(event) {
        if (MAP_CONFIG.provider === "baidu") return;
        state.dragging = false;
        state.lastPointer = null;
        viewport.classList.remove("dragging");
        try { viewport.releasePointerCapture(event.pointerId); } catch (error) {}
      });
      viewport.addEventListener("click", function(event) {
        if (event.target === viewport || event.target.id === "markerLayer") {
          state.selectedCustomerId = null;
          popup.classList.remove("show");
          renderAll();
        }
      });
      document.addEventListener("click", function(event) {
        if (!popup.classList.contains("show")) return;
        if (event.target.closest(".popup")) return;
        state.selectedCustomerId = null;
        popup.classList.remove("show");
        renderAll();
      });
      window.addEventListener("resize", renderAll);
    }

    function renderAll() {
      renderMarkers();
      renderSideList();
      const customer = selectedCustomer();
      if (customer) renderPopup(customer);
      else popup.classList.remove("show");
    }

    setupFilters();
    setupMapEvents();
    viewport.dataset.mapProvider = MAP_CONFIG.provider;
    viewport.dataset.mapReady = MAP_CONFIG.provider === "baidu" ? "loading" : "true";
    viewport.dataset.mapViewReady = MAP_CONFIG.provider === "baidu" ? "false" : "true";
    viewport.dataset.mapInteractionMode = MAP_CONFIG.provider === "baidu" ? "loading" : "custom";
    if (MAP_CONFIG.provider === "baidu") {
      tileLayer.classList.add("hidden");
      baiduMapElement.classList.add("active");
    }
    tileAttribution.innerHTML = MAP_CONFIG.attribution;
    loadBaiduMap();
    renderAll();
  </script>
</body>
</html>
